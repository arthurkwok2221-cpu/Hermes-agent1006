<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthur Kwok 專案導覽</title>
<style>
:root{
  --bg:#f4f6fb;--surface:#ffffff;--ink:#141a26;--muted:#5c667a;--line:#e2e7f0;
  --accent:#0284c7;--accent2:#059669;--warn:#d97706;--soft:#eef2fa;--shadow:0 1px 3px rgba(20,30,60,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f131c;--surface:#171d2b;--ink:#e8ecf5;--muted:#98a2ba;--line:#2a3346;
  --accent:#5b8cff;--accent2:#34d399;--warn:#fbbf24;--soft:#1d2c4d;--shadow:0 1px 3px rgba(0,0,0,.5)}
}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:26px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:6px 0 22px}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;height:44px;padding:0 14px 0 38px;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{padding:8px 16px;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer}
.fbtn:hover{border-color:var(--accent)}
.fbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.status-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.status-badge .dot{width:8px;height:8px;border-radius:50%}
.sb-live{background:color-mix(in srgb,var(--accent2) 14%,transparent);color:var(--accent2)}
.sb-live .dot{background:var(--accent2)}
.sb-dev{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.sb-dev .dot{background:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 10%,transparent)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h2{font-size:17px;font-weight:700}
.card .desc{font-size:14px;color:var(--muted);flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--soft);padding:3px 9px;border-radius:6px}
.cat{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--accent);text-transform:uppercase}
.card-foot{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.card-foot a{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.card-foot a:hover{text-decoration:underline}
.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.empty.show{display:block}
.err{display:none;background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid var(--warn);border-radius:10px;padding:14px 18px;font-size:14px;margin-bottom:16px}
.err.show{display:block}
.meta{margin-top:28px;font-size:12.5px;color:var(--muted);text-align:center}
.meta code{background:var(--soft);padding:2px 7px;border-radius:5px;font-size:12px}
@media (max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:22px}}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#111;--muted:#555;--line:#ccc;--soft:#f4f6fb;--shadow:none}
  .controls,.meta{display:none}
  .card{page-break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Arthur Kwok 專案導覽</h1>
  <p class="sub">所有 Web 應用程式集中一處：搜尋、分類篩選、狀態與連結。</p>
  <div class="err" id="err"></div>

  <div class="controls">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="搜尋專案名稱、說明、技術…" aria-label="搜尋專案">
    </div>
    <div class="filters" id="filters" role="group" aria-label="分類篩選"></div>
  </div>

  <div class="grid" id="grid" aria-live="polite"></div>
  <div class="empty" id="empty">沒有符合條件的專案。請調整搜尋或分類。</div>

  <p class="meta">新增專案：將資料加入 <code>projects.json</code> 並推送至 <code>main</code>，CI 自動部署。<br>部署網址：<a href="https://arthurkwok2221-cpu.github.io/Hermes-agent1006/" style="color:var(--accent)">arthurkwok2221-cpu.github.io/Hermes-agent1006</a></p>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let projects = [], categories = [];

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function statusClass(st){ return st === '已上線' ? 'sb-live' : 'sb-dev'; }

  function buildFilters(){
    const f = $('filters');
    const cats = ['全部', ...categories];
    f.innerHTML = cats.map(c=>`<button class="fbtn${c==='全部'?' active':''}" data-cat="${esc(c)}" aria-pressed="${c==='全部'}">${esc(c)}</button>`).join('');
    f.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{
      f.querySelectorAll('.fbtn').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false');});
      b.classList.add('active');b.setAttribute('aria-pressed','true');
      render(b.dataset.cat);
    }));
  }

  function render(cat){
    const q = $('q').value.trim().toLowerCase();
    const list = projects.filter(p=>{
      if(cat!=='全部' && p.category!==cat) return false;
      if(!q) return true;
      const hay = [p.name,p.description,(p.stack||[]).join(' '),p.category,p.status].join(' ').toLowerCase();
      return q.split(/\s+/).every(w=>hay.includes(w));
    });
    const grid = $('grid');
    if(!list.length){ grid.innerHTML=''; $('empty').classList.add('show'); return; }
    $('empty').classList.remove('show');
    grid.innerHTML = list.map(p=>`
      <article class="card">
        <div class="card-head">
          <div><div class="cat">${esc(p.category||'未分類')}</div><h2>${esc(p.name)}</h2></div>
          <span class="status-badge ${statusClass(p.status)}"><span class="dot"></span>${esc(p.status)}</span>
        </div>
        <p class="desc">${esc(p.description||'')}</p>
        <div class="tags">${(p.stack||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>
        <div class="card-foot">
          <a href="${esc(p.url)}" ${/^https?:/.test(p.url)?'target="_blank" rel="noopener"':''}>開啟專案 →</a>
        </div>
      </article>`).join('');
  }

  function init(data){
    projects = data.projects || [];
    categories = data.categories || [...new Set(projects.map(p=>p.category).filter(Boolean))];
    buildFilters();
    render('全部');
  }

  fetch('projects.json').then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(init).catch(e=>{
    const el = $('err');
    el.textContent = '無法載入 projects.json：' + e.message + '（請確認檔案存在且為有效 JSON）';
    el.classList.add('show');
  });

  $('q').addEventListener('input',()=>render($('filters').querySelector('.fbtn.active').dataset.cat));
})();
</script>
</body>
</html>
